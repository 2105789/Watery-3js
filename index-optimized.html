<!DOCTYPE html>
<html>
  <head>
    <title>ThreeJS Caustics - Optimized</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Optimized ThreeJS water simulation with caustics">
    
    <!-- Resource hints for faster loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/three@v0.117.0" as="script">
    <link rel="preload" href="index-optimized.js" as="script">
    
    <!-- Optimized script loading with async/defer -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.117.0" async></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/controls/OrbitControls.js" defer></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/loaders/OBJLoader.js" defer></script>
    <script type="text/javascript" src="module/stats.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js" defer></script>
  </head>

  <body>
    <canvas id="canvas"></canvas>
    <div id="loading" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: Arial, sans-serif; font-size: 18px; color: #333;">
      Loading optimized water simulation...
    </div>
    <script type="text/javascript" src="index-optimized.js" defer></script>
  </body>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    
    /* Optimize canvas rendering */
    #canvas {
      display: block;
      image-rendering: optimizeSpeed;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: optimize-contrast;
      will-change: transform;
    }
    
    /* Performance optimizations */
    body {
      overflow: hidden;
      background: #000;
    }
    
    /* Hide loading screen when app is ready */
    .loaded #loading {
      display: none;
    }
  </style>
</html>
