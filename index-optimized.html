<!DOCTYPE html>
<html>
  <head>
    <title>ThreeJS Caustics - Optimized</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Performance-optimized ThreeJS Water Simulation with Caustics">
    
    <!-- Resource hints for faster loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/three@v0.117.0" as="script">
    <link rel="preload" href="index-optimized.js" as="script">
    
    <!-- Load Three.js with async -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.117.0" async></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/controls/OrbitControls.js" async></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/three@v0.117.0/examples/js/loaders/OBJLoader.js" async></script>
    <script type="text/javascript" src="module/stats.js" async></script>
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js" async></script>
  </head>

  <body>
    <canvas id="canvas"></canvas>
    <script type="text/javascript" src="index-optimized.js"></script>
  </body>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    
    /* Optimize canvas rendering */
    #canvas {
      display: block;
      image-rendering: optimizeSpeed;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: optimize-contrast;
    }
    
    /* Optimize body for performance */
    body {
      overflow: hidden;
      background: #000;
    }
  </style>
</html>
